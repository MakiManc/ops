# The sync Worker, deployed separately from the Pages project because Pages Functions
# cannot carry a cron trigger.
#
#   npx wrangler deploy --config wrangler.sync.toml
#   npx wrangler secret put MINTSOFT_USERNAME --config wrangler.sync.toml
#   npx wrangler secret put MINTSOFT_PASSWORD --config wrangler.sync.toml
name = "mintsoft-portal-sync"
main = "worker/sync.ts"
compatibility_date = "2026-09-21"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mintsoft-portal"
database_id = ""   # same database as the Pages project

[triggers]
crons = [
  "*/15 * * * *",   # stock
  "0 * * * *",      # catalogue and inbound
  "0 3 * * *",      # nightly full pass
]

[vars]
# Set once discovery identifies them. Pinning the client matters: without it a sync
# could read another of Mercium's customers if the API user can see more than Maki.
MINTSOFT_CLIENT_ID = ""
MINTSOFT_WAREHOUSE_ID = ""
