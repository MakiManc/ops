<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM Control Centre — Maki &amp; Ramen</title>
<style>
  :root{
    --maki:#E94E1B; --ink:#1d1d1f; --muted:#6b6b70; --line:#e7e7ea;
    --bg:#f6f6f7; --card:#ffffff; --green:#1c8a4d; --amber:#c8860a; --red:#cf2e2e;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--maki);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:18px}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:12.5px}
  .meta{margin-left:auto;text-align:right;color:var(--muted);font-size:12px;line-height:1.4}
  main{max-width:980px;margin:22px auto;padding:0 18px}
  .week{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
  .week b{font-size:18px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.4px}
  .pill.green{background:#e7f4ec;color:var(--green)}
  .pill.amber{background:#fbf1dc;color:var(--amber)}
  .pill.red{background:#fbe4e4;color:var(--red)}
  .pill.grey{background:#eee;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:18px 20px;margin:0 0 16px}
  .sitehead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .sitehead h2{font-size:18px;margin:0;font-weight:700}
  .who{color:var(--muted);font-size:13px;margin:2px 0 16px}
  .who span{margin-right:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{border:1px solid var(--line);border-radius:11px;padding:12px 13px;position:relative}
  .kpi .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .v{font-size:22px;font-weight:750;margin-top:3px;letter-spacing:-.5px}
  .kpi .d{font-size:12.5px;margin-top:3px;color:var(--muted)}
  .kpi .dot{position:absolute;top:13px;right:13px;width:9px;height:9px;border-radius:50%}
  .dot.green{background:var(--green)} .dot.amber{background:var(--amber)} .dot.red{background:var(--red)}
  .delta.pos{color:var(--green)} .delta.neg{color:var(--red)}
  h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin:20px 0 10px;border-top:1px solid var(--line);padding-top:14px}
  .rev{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .rev .b{font-size:13px;color:var(--muted)}
  .rev .b strong{display:block;font-size:20px;color:var(--ink);font-weight:750}
  .rev .b a{color:var(--maki);text-decoration:none;font-size:11.5px;font-weight:600}
  .stars{flex:1;min-width:220px;max-width:340px}
  .srow{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0;color:var(--muted)}
  .srow .lab{width:30px;text-align:right;color:var(--ink);font-weight:600}
  .srow .bar{flex:1;height:8px;background:#eee;border-radius:5px;overflow:hidden}
  .srow .bar i{display:block;height:100%;background:var(--maki);border-radius:5px}
  .srow.neg .bar i{background:var(--red)}
  .srow .cnt{width:26px;text-align:left;color:var(--ink);font-weight:600}
  .negbox{margin-top:6px}
  .negitem{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;
    padding:9px 11px;margin:7px 0;font-size:13px}
  .negitem .h{font-weight:600;margin-bottom:2px}
  .negitem .h b{color:var(--red)}
  .negitem .meta{color:var(--muted);font-size:11.5px}
  .ok{color:var(--green);font-size:13px}
  .todo{color:var(--amber);font-size:13px;font-weight:600}
  .blank{color:var(--muted);font-size:13.5px;font-style:italic}
  ul.gaps{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
  ul.gaps li{margin:2px 0}
  footer{max-width:980px;margin:8px auto 40px;padding:0 18px;color:var(--muted);font-size:11.5px}
  .err{background:#fbe4e4;color:var(--red);padding:12px 14px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <h1>AM Control Centre</h1>
      <div class="sub">Maki &amp; Ramen — Area Management</div>
    </div>
  </div>
  <div class="meta" id="meta"></div>
</header>

<main>
  <div class="week" id="week"></div>
  <div id="sites"></div>
  <div id="error"></div>
</main>
<footer id="footer"></footer>

<script>
// ── Clean JSON-driven shell. No baked data, no Kobas. Reads one data file. ──
const DATA_URL = "./data/maki1_wc_2026-06-08.json";

// RAG thresholds (locked 16 Jun 2026; food retargeted to 23%)
function ragSales(v){ if(v==null) return "grey"; if(v>=0) return "green"; if(v>=-5) return "amber"; return "red"; }
function ragFood(pct,tgt){ if(pct==null) return "grey"; const t=tgt??23; if(pct<=t) return "green"; if(pct<=t+2) return "amber"; return "red"; }
function ragWage(pct){ if(pct==null) return "grey"; if(pct<=22) return "green"; if(pct<=26) return "amber"; return "red"; }
const RANK={green:0,grey:0,amber:1,red:2};
function worst(...rags){ return rags.reduce((a,b)=> RANK[b]>RANK[a]?b:a, "green"); }

const gbp = n => "£"+Number(n).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function tile(k,v,d,rag){
  return `<div class="kpi">${rag?`<span class="dot ${rag}"></span>`:""}
    <div class="k">${k}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:""}</div>`;
}

function renderSite(code, s){
  const kp = s.kpis;
  const rSales = ragSales(kp.sales?.var_pct);
  const rFood  = ragFood(kp.food_pct?.actual, kp.food_pct?.target);
  const rWage  = ragWage(kp.wage_pct?.actual);
  const overall = worst(rSales, rFood, rWage);

  const salesDelta = kp.sales?.var_pct!=null
    ? `<span class="delta ${kp.sales.var_pct>=0?'pos':'neg'}">${kp.sales.var_pct>=0?'+':''}${kp.sales.var_pct}%</span> vs target ${gbp(kp.sales.target)}`
    : "";
  const coversD = kp.covers?.var_pct!=null ? `${kp.covers.var_pct>=0?'+':''}${kp.covers.var_pct}% WoW` : "no WoW baseline";
  const sphLbl  = kp.sph?.label || "Spend Per Head";

  let tiles = "";
  tiles += tile("Sales", gbp(kp.sales.actual), salesDelta, rSales);
  tiles += tile("Covers", Number(kp.covers.actual).toLocaleString("en-GB"), coversD, null);
  tiles += tile("SPH", gbp(kp.sph.actual), sphLbl, null);
  tiles += tile("Wage %", kp.wage_pct.actual+"%", kp.wage_pct.target?("target "+kp.wage_pct.target+"%"):"target n/a", rWage);
  tiles += tile("Food %", kp.food_pct.actual+"%", "target "+(kp.food_pct.target??23)+"%", rFood);
  tiles += tile("Labour", kp.labour_hours.actual+" h", "scheduled hours", null);
  tiles += tile("Waste", gbp(kp.waste.actual), "logged", null);

  // Reviews
  const rv = s.reviews||{};
  const bd = rv.star_breakdown||{};
  const newTotal = Object.values(bd).reduce((a,b)=>a+(b||0),0) || (rv.new_reviews??0);
  const venueRating = rv.venue_rating!=null
    ? `<strong>${rv.venue_rating}★</strong>current venue rating${rv.venue_review_count!=null?` · ${Number(rv.venue_review_count).toLocaleString("en-GB")} reviews`:""}`
       + (rv.google_url?`<br><a href="${esc(rv.google_url)}" target="_blank" rel="noopener">open Google listing ↗</a>`:"")
    : `<strong>–</strong>current venue rating`;

  // Weekly star breakdown bars (5 → 1)
  const starRows = [5,4,3,2,1].map(st=>{
    const c = bd[st]||0;
    const pct = newTotal? Math.round(c/newTotal*100):0;
    return `<div class="srow${st<=3?" neg":""}"><span class="lab">${st}★</span>
      <span class="bar"><i style="width:${pct}%"></i></span><span class="cnt">${c}</span></div>`;
  }).join("");

  const revHtml = `<div class="rev">
    <div class="b">${venueRating}</div>
    <div class="b"><strong>${rv.week_avg_rating??"–"}★</strong>week avg (${newTotal} new)</div>
    <div class="stars">${starRows}</div>
  </div>`;

  // Negative reviews (3/2/1★)
  const negCount = (bd[3]||0)+(bd[2]||0)+(bd[1]||0);
  let negHtml;
  if(negCount===0){
    negHtml = `<div class="ok">✓ No 3/2/1★ reviews this week — nothing to pull from Google.</div>`;
  } else if(rv.negative_reviews && rv.negative_reviews.length){
    negHtml = `<div class="negbox">${rv.negative_reviews.map(n=>`
      <div class="negitem">
        <div class="h"><b>${n.stars}★</b> ${esc(n.author||"Anonymous")}</div>
        <div>${esc(n.text||"")}</div>
        <div class="meta">${esc(n.date||"")}${n.url?` · <a href="${esc(n.url)}" target="_blank" rel="noopener">view ↗</a>`:""}</div>
      </div>`).join("")}</div>`;
  } else {
    negHtml = `<div class="todo">⚠ ${negCount} negative review${negCount>1?"s":""} (3/2/1★) this week — pull text from Maki 1's Google listing.</div>`;
  }

  // Deliveroo
  const delHtml = s.deliveroo
    ? `<div class="rev"><div class="b"><strong>${gbp(s.deliveroo.sales)}</strong>Deliveroo sales</div></div>`
    : `<div class="blank">Awaiting data — Deliveroo feed being rebuilt for this site.</div>`;

  // Gaps
  const gapsHtml = (s.gaps&&s.gaps.length)
    ? `<ul class="gaps">${s.gaps.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>`
    : `<div class="blank">No open data gaps.</div>`;

  const label = {green:"On track",amber:"Watch",red:"Red light",grey:"No data"}[overall];

  return `<div class="card">
    <div class="sitehead">
      <h2>${esc(s.name)}</h2>
      <span class="pill ${overall}">${label}</span>
    </div>
    <div class="who">
      <span>Code <b>${esc(code)}</b></span>
      <span>GM ${esc(s.gm)}</span>
      <span>AM ${esc(s.am)}</span>
      <span>Cluster ${esc(s.cluster)}</span>
    </div>
    <div class="grid">${tiles}</div>
    <h3 class="sec">Customer experience</h3>${revHtml}
    <h3 class="sec">Negative reviews this week (3/2/1★)</h3>${negHtml}
    <h3 class="sec">Deliveroo</h3>${delHtml}
    <h3 class="sec">Known data gaps</h3>${gapsHtml}
  </div>`;
}

fetch(DATA_URL,{cache:"no-store"})
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(data=>{
    const codes = Object.keys(data.sites||{});
    document.getElementById("week").innerHTML =
      `<b>${esc(data.week.label)}</b><span class="pill grey">${codes.length} site${codes.length>1?"s":""}</span>`;
    document.getElementById("meta").innerHTML =
      `Generated ${esc((data.generated_at||"").replace("T"," ").slice(0,16))}<br>Source: per-site KPI sheet`;
    document.getElementById("sites").innerHTML =
      codes.map(c=>renderSite(c,data.sites[c])).join("");
    document.getElementById("footer").innerHTML =
      `Data-driven shell · reads <code>${esc(DATA_URL)}</code> · no values baked into this page.`;
  })
  .catch(e=>{
    document.getElementById("error").innerHTML =
      `<div class="err">Could not load data (${esc(e.message)}). Serve this file over HTTP — <code>fetch</code> is blocked on <code>file://</code>.</div>`;
  });
</script>
</body>
</html>
