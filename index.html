<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM Control Centre — Maki &amp; Ramen</title>
<style>
  :root{
    --maki:#E94E1B; --ink:#1d1d1f; --muted:#6b6b70; --line:#e7e7ea;
    --bg:#f6f6f7; --card:#ffffff; --green:#1c8a4d; --amber:#c8860a; --red:#cf2e2e;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:34px;height:34px;border-radius:8px;background:var(--maki);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:18px}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:12.5px}
  .meta{margin-left:auto;text-align:right;color:var(--muted);font-size:12px;line-height:1.4}
  .wsel{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .wsel select{font:inherit;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;
    color:var(--ink);padding:6px 28px 6px 10px;border:1px solid var(--line);border-radius:9px;
    background:#fff;cursor:pointer}
  main{max-width:980px;margin:22px auto;padding:0 18px}
  .week{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
  .week b{font-size:18px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.4px}
  .pill.green{background:#e7f4ec;color:var(--green)}
  .pill.amber{background:#fbf1dc;color:var(--amber)}
  .pill.red{background:#fbe4e4;color:var(--red)}
  .pill.grey{background:#eee;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:18px 20px;margin:0 0 16px}
  .sitehead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .sitehead h2{font-size:18px;margin:0;font-weight:700}
  .who{color:var(--muted);font-size:13px;margin:2px 0 16px}
  .who span{margin-right:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{border:1px solid var(--line);border-radius:11px;padding:12px 13px;position:relative}
  .kpi .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .v{font-size:22px;font-weight:750;margin-top:3px;letter-spacing:-.5px}
  .kpi .d{font-size:12.5px;margin-top:3px;color:var(--muted)}
  .kpi .dot{position:absolute;top:13px;right:13px;width:9px;height:9px;border-radius:50%}
  .dot.green{background:var(--green)} .dot.amber{background:var(--amber)} .dot.red{background:var(--red)}
  .delta.pos{color:var(--green)} .delta.neg{color:var(--red)}
  h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin:20px 0 10px;border-top:1px solid var(--line);padding-top:14px}
  .rev{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .rev .b{font-size:13px;color:var(--muted)}
  .rev .b strong{display:block;font-size:20px;color:var(--ink);font-weight:750}
  .rev .b a{color:var(--maki);text-decoration:none;font-size:11.5px;font-weight:600}
  .stars{flex:1;min-width:220px;max-width:340px}
  .srow{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0;color:var(--muted)}
  .srow .lab{width:30px;text-align:right;color:var(--ink);font-weight:600}
  .srow .bar{flex:1;height:8px;background:#eee;border-radius:5px;overflow:hidden}
  .srow .bar i{display:block;height:100%;background:var(--maki);border-radius:5px}
  .srow.neg .bar i{background:var(--red)}
  .srow .cnt{width:26px;text-align:left;color:var(--ink);font-weight:600}
  .negbox{margin-top:6px}
  .negitem{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;
    padding:9px 11px;margin:7px 0;font-size:13px}
  .negitem .h{font-weight:600;margin-bottom:2px}
  .negitem .h b{color:var(--red)}
  .negitem .meta{color:var(--muted);font-size:11.5px}
  .ok{color:var(--green);font-size:13px}
  .todo{color:var(--amber);font-size:13px;font-weight:600}
  .blank{color:var(--muted);font-size:13.5px;font-style:italic}
  ul.gaps{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
  ul.gaps li{margin:2px 0}
  .score{margin-left:auto;font-weight:800;font-size:20px;padding:4px 12px;border-radius:999px}
  .score small{font-size:11px;font-weight:600;opacity:.7}
  .score.green{background:#e7f4ec;color:var(--green)}
  .score.amber{background:#fbf1dc;color:var(--amber)}
  .score.red{background:#fbe4e4;color:var(--red)}
  .scorewrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .scorebig{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1;display:flex;align-items:baseline;gap:8px}
  .scorebig span{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted)}
  .scorebig.green{color:var(--green)} .scorebig.amber{color:var(--amber)} .scorebig.red{color:var(--red)}
  .comps{flex:1;min-width:260px}
  .crow{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0;color:var(--muted)}
  .crow .cn{width:92px;color:var(--ink);font-weight:600}
  .crow .cw{width:30px;font-size:11px}
  .crow .cbar{flex:1;height:7px;background:#eee;border-radius:5px;overflow:hidden}
  .crow .cbar i{display:block;height:100%;background:var(--maki);border-radius:5px}
  .crow .cv{width:34px;text-align:right;color:var(--ink);font-weight:600}
  .scorenote{color:var(--muted);font-size:11px;margin-top:8px}
  footer{max-width:980px;margin:8px auto 40px;padding:0 18px;color:var(--muted);font-size:11.5px}
  .err{background:#fbe4e4;color:var(--red);padding:12px 14px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <h1>AM Control Centre</h1>
      <div class="sub">Maki &amp; Ramen — Area Management</div>
    </div>
  </div>
  <label class="wsel">Week<select id="weekSel" aria-label="Select week"></select></label>
  <div class="meta" id="meta"></div>
</header>

<main>
  <div class="week" id="week"></div>
  <div id="sites"></div>
  <div id="error"></div>
</main>
<footer id="footer"></footer>

<script>
// ── Clean JSON-driven shell. No baked data, no Kobas. ──
// Reads a manifest, then fetches ONE file per site (per-site fault isolation:
// one site's missing/bad file → that tile shows an error, the rest still render).
const DATA_DIR = "./data/";
const WEEKS_INDEX_URL = DATA_DIR + "weeks_index.json";
const LS_KEY = "am_rebuild_week";
let CURRENT_MANIFEST = "";   // set when a week loads

// RAG thresholds (locked 16 Jun 2026; food retargeted to 23%)
function ragSales(v){ if(v==null) return "grey"; if(v>=0) return "green"; if(v>=-5) return "amber"; return "red"; }
function ragFood(pct,tgt){ if(pct==null) return "grey"; const t=tgt??23; if(pct<=t) return "green"; if(pct<=t+2) return "amber"; return "red"; }
function ragWage(pct){ if(pct==null) return "grey"; if(pct<=22) return "green"; if(pct<=26) return "amber"; return "red"; }
const RANK={green:0,grey:0,amber:1,red:2};
function worst(...rags){ return rags.reduce((a,b)=> RANK[b]>RANK[a]?b:a, "green"); }

const gbp = n => "£"+Number(n).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// signed delta — money=true → "−£0.09", money=false → "+13"
const signed = (n,money) => (n>=0?"+":"−") + (money ? "£"+Math.abs(n).toFixed(2) : Math.abs(n));

function tile(k,v,d,rag){
  return `<div class="kpi">${rag?`<span class="dot ${rag}"></span>`:""}
    <div class="k">${k}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:""}</div>`;
}

function renderSite(code, s){
  const kp = s.kpis;
  const rSales = ragSales(kp.sales?.var_pct);
  const rFood  = ragFood(kp.food_pct?.actual, kp.food_pct?.target);
  const rWage  = ragWage(kp.wage_pct?.actual);
  const overall = worst(rSales, rFood, rWage);

  const salesDelta = kp.sales?.var_pct!=null
    ? `<span class="delta ${kp.sales.var_pct>=0?'pos':'neg'}">${kp.sales.var_pct>=0?'+':''}${kp.sales.var_pct}%</span> vs target ${gbp(kp.sales.target)}`
    : "";
  const coversD = kp.covers?.wow_abs!=null
    ? `<span class="delta ${kp.covers.wow_abs>=0?'pos':'neg'}">${signed(kp.covers.wow_abs,false)} (${signed(kp.covers.wow_pct,false)}%)</span> WoW`
    : "no WoW baseline";
  const sphLbl  = kp.sph?.label || "Spend Per Head";
  const sphD = kp.sph?.wow_abs!=null
    ? `<span class="delta ${kp.sph.wow_abs>=0?'pos':'neg'}">${signed(kp.sph.wow_abs,true)} (${signed(kp.sph.wow_pct,false)}%)</span> WoW`
    : sphLbl;

  let tiles = "";
  tiles += tile("Sales", gbp(kp.sales.actual), salesDelta, rSales);
  tiles += tile("Covers", Number(kp.covers.actual).toLocaleString("en-GB"), coversD, null);
  tiles += tile("SPH", gbp(kp.sph.actual), sphD, null);
  tiles += tile("Wage %", kp.wage_pct.actual+"%", kp.wage_pct.target?("target "+kp.wage_pct.target+"%"):"target n/a", rWage);
  tiles += tile("Food %", kp.food_pct.actual+"%", "target "+(kp.food_pct.target??23)+"%", rFood);
  tiles += tile("Labour", kp.labour_hours.actual+" h", "scheduled hours", null);
  tiles += tile("Waste", gbp(kp.waste.actual), "logged", null);

  // Reviews
  const rv = s.reviews||{};
  const bd = rv.star_breakdown||{};
  const newTotal = Object.values(bd).reduce((a,b)=>a+(b||0),0) || (rv.new_reviews??0);
  const venueRating = rv.venue_rating!=null
    ? `<strong>${rv.venue_rating}★</strong>current venue rating${rv.venue_review_count!=null?` · ${Number(rv.venue_review_count).toLocaleString("en-GB")} reviews`:""}`
       + (rv.google_url?`<br><a href="${esc(rv.google_url)}" target="_blank" rel="noopener">open Google listing ↗</a>`:"")
    : `<strong>–</strong>current venue rating`;

  // Weekly star breakdown bars (5 → 1)
  const starRows = [5,4,3,2,1].map(st=>{
    const c = bd[st]||0;
    const pct = newTotal? Math.round(c/newTotal*100):0;
    return `<div class="srow${st<=3?" neg":""}"><span class="lab">${st}★</span>
      <span class="bar"><i style="width:${pct}%"></i></span><span class="cnt">${c}</span></div>`;
  }).join("");

  const revHtml = `<div class="rev">
    <div class="b">${venueRating}</div>
    <div class="b"><strong>${rv.week_avg_rating??"–"}★</strong>week avg (${newTotal} new)</div>
    <div class="stars">${starRows}</div>
  </div>`;

  // Negative reviews (3/2/1★)
  const negCount = (bd[3]||0)+(bd[2]||0)+(bd[1]||0);
  let negHtml;
  if(negCount===0){
    negHtml = `<div class="ok">✓ No 3/2/1★ reviews this week — nothing to pull from Google.</div>`;
  } else if(rv.negative_reviews && rv.negative_reviews.length){
    negHtml = `<div class="negbox">${rv.negative_reviews.map(n=>`
      <div class="negitem">
        <div class="h"><b>${n.stars}★</b> ${esc(n.author||"Anonymous")}</div>
        <div>${esc(n.text||"")}</div>
        <div class="meta">${esc(n.date||"")}${n.url?` · <a href="${esc(n.url)}" target="_blank" rel="noopener">view ↗</a>`:""}</div>
      </div>`).join("")}</div>`;
  } else {
    negHtml = `<div class="todo">⚠ ${negCount} negative review${negCount>1?"s":""} (3/2/1★) this week — pull text from ${esc(s.name)}'s Google listing.</div>`;
  }

  // Deliveroo
  let delHtml;
  if(s.deliveroo){
    const d = s.deliveroo, w = d.wow||{};
    const gmvDelta = w.gmv_pct!=null
      ? `<span class="delta ${w.gmv_pct>=0?"pos":"neg"}">${w.gmv_pct>=0?"▲":"▼"} ${Math.abs(w.gmv_pct)}% WoW</span>`
      : "GMV";
    let dTiles = "";
    dTiles += tile("Deliveroo GMV", gbp(d.sales), gmvDelta, null);
    if(d.orders!=null) dTiles += tile("Orders", Number(d.orders).toLocaleString("en-GB"), w.orders_abs!=null?`<span class="delta ${w.orders_abs>=0?"pos":"neg"}">${w.orders_abs>=0?"+":""}${w.orders_abs} WoW</span>`:"this week", null);
    if(d.aov!=null) dTiles += tile("AOV", gbp(d.aov), "avg order value", null);
    if(d.rating!=null) dTiles += tile("Deliveroo rating", d.rating+"★", "this week", d.rating>=4.7?"green":(d.rating>=4.4?"amber":"red"));
    if(d.conversion_pct!=null) dTiles += tile("Conversion", d.conversion_pct+"%", "new to site", null);
    if(d.rejection_pct!=null) dTiles += tile("Rejection", d.rejection_pct+"%", "orders rejected", d.rejection_pct<=1?"green":"amber");
    delHtml = `<div class="grid">${dTiles}</div>`;
  } else {
    delHtml = `<div class="blank">Awaiting data — Deliveroo feed being rebuilt for this site.</div>`;
  }

  // Gaps
  const gapsHtml = (s.gaps&&s.gaps.length)
    ? `<ul class="gaps">${s.gaps.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>`
    : `<div class="blank">No open data gaps.</div>`;

  // Site Efficiency Score (composite)
  const es = s.efficiency_score;
  let scoreBadge = "", scoreSection = "";
  if(es){
    scoreBadge = `<span class="score ${es.rag}">${es.score}<small>/100</small></span>`;
    const comps = es.components||{};
    const names = {wage:"Wage",food:"Food",sales:"Sales",weekly_star:"Weekly ★",food_var:"Food variance"};
    const compRows = ["wage","food","sales","weekly_star","food_var"]
      .filter(k=>comps[k]).map(k=>{
        const c=comps[k];
        return `<div class="crow"><span class="cn">${names[k]||k}</span>
          <span class="cw">w${c.weight}</span>
          <span class="cbar"><i style="width:${Math.min(100,c.value)}%"></i></span>
          <span class="cv">${c.value}</span></div>`;
      }).join("");
    scoreSection = `<h3 class="sec">Site Efficiency Score</h3>
      <div class="scorewrap">
        <div class="scorebig ${es.rag}">${es.score}<span>/100 · ${esc((es.rag||"").toUpperCase())}</span></div>
        <div class="comps">${compRows}</div>
      </div>
      <div class="scorenote">${esc(es.scale||"")}${es.formula_ref?` · ${esc(es.formula_ref)}`:""}${
        (es.components_dropped&&es.components_dropped.length)
          ? `<br><b style="color:var(--amber)">⚠ Low confidence</b> — computed on ${Object.keys(es.components||{}).length} of 5 components; ${es.components_dropped.length} dropped (${es.components_dropped.map(esc).join(", ")}).`
          : ""}</div>`;
  }

  // Stock-take variance (±5% band)
  const st = s.stock_take;
  let stockSection = "";
  if(st){
    const stTile = (lab,o)=>{
      if(!o) return "";
      const rag = o.within_band ? "green" : "red";
      const note = "target "+esc(o.target)+(o.within_band?" · within band":" · OUT OF BAND");
      return tile(lab, o.variance_pct+"%", note, rag);
    };
    stockSection = `<h3 class="sec">Stock-take variance</h3>
      <div class="grid">${stTile("Drinks variance",st.drinks)}${stTile("Food variance",st.food)}</div>`;
  }

  // Review response rate — open placeholder
  const rrHtml = (rv.response_rate==null)
    ? `<div class="blank">Response rate — open placeholder (no automated source yet).</div>`
    : `<div class="b"><strong>${rv.response_rate}%</strong>response rate</div>`;

  // Issues & solutions — open placeholder
  const iss = s.issues_solutions;
  const issHtml = (iss && iss.items && iss.items.length)
    ? `<div class="negbox">${iss.items.map(it=>`
        <div class="negitem"><div class="h"><b>Problem</b> ${esc(it.problem||"")}</div>
        <div>Solution — ${esc(it.solution||"")}</div></div>`).join("")}</div>`
    : `<div class="blank">Open placeholder — pending GM KPI meeting pull (PROBLEM + SOLUTION).</div>`;

  const label = {green:"On track",amber:"Watch",red:"Red light",grey:"No data"}[overall];

  return `<div class="card">
    <div class="sitehead">
      <h2>${esc(s.name)}</h2>
      <span class="pill ${overall}">${label}</span>
      ${scoreBadge}
    </div>
    <div class="who">
      <span>Code <b>${esc(code)}</b></span>
      <span>GM ${esc(s.gm)}</span>
      <span>AM ${esc(s.am)}</span>
      <span>Cluster ${esc(s.cluster)}</span>
    </div>
    <div class="grid">${tiles}</div>
    ${scoreSection}
    ${stockSection}
    <h3 class="sec">Customer experience</h3>${revHtml}${rrHtml}
    <h3 class="sec">Negative reviews this week (3/2/1★)</h3>${negHtml}
    <h3 class="sec">Issues &amp; solutions</h3>${issHtml}
    <h3 class="sec">Deliveroo</h3>${delHtml}
    <h3 class="sec">Known data gaps</h3>${gapsHtml}
  </div>`;
}

const here = DATA_DIR;

function errorCard(code, name, msg){
  return `<div class="card"><div class="sitehead"><h2>${esc(name||code)}</h2>
    <span class="pill grey">No data</span></div>
    <div class="who"><span>Code <b>${esc(code)}</b></span></div>
    <div class="err">Could not load this site (${esc(msg)}). Its pull may have failed — every other site still renders.</div></div>`;
}

function loadWeek(manifestFile){
  CURRENT_MANIFEST = DATA_DIR + manifestFile;
  document.getElementById("error").innerHTML = "";
  return fetch(CURRENT_MANIFEST,{cache:"no-store"})
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(async manifest=>{
    const list = manifest.sites||[];
    document.getElementById("week").innerHTML =
      `<b>${esc(manifest.week.label)}</b><span class="pill grey">${list.length} site${list.length>1?"s":""}</span>`;
    document.getElementById("meta").innerHTML =
      `Generated ${esc((manifest.generated_at||"").replace("T"," ").slice(0,16))}<br>Per-site KPI / Raw Data / stock-take / reviews / Deliveroo`;

    // Fetch every site file independently — one failure can't take down the others.
    const settled = await Promise.allSettled(list.map(si =>
      fetch(here+si.file,{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    ));

    // Group by cluster, preserving manifest order.
    const clusters = (manifest.clusters||[]).map(c=>c.name);
    const order = clusters.length ? clusters : [...new Set(list.map(s=>s.cluster))];
    const byCluster = {}; order.forEach(c=>byCluster[c]=[]);
    list.forEach((si,i)=>{
      const res = settled[i];
      let html;
      if(res.status==="fulfilled"){
        const data = res.value; const s = (data.sites||{})[si.code];
        html = s ? renderSite(si.code, s) : errorCard(si.code, si.name, "site missing in file");
      } else {
        html = errorCard(si.code, si.name, res.reason && res.reason.message || "fetch failed");
      }
      (byCluster[si.cluster] || (byCluster[si.cluster]=[])).push(html);
    });

    document.getElementById("sites").innerHTML = order.map(cl=>{
      const cards = byCluster[cl]||[]; if(!cards.length) return "";
      const am = (manifest.clusters||[]).find(c=>c.name===cl)?.am;
      return `<div class="week" style="margin:26px 0 12px">
          <b>${esc(cl)}</b><span class="pill grey">${cards.length} site${cards.length>1?"s":""}${am?` · AM ${esc(am)}`:""}</span>
        </div>${cards.join("")}`;
    }).join("");

    const failed = settled.filter(s=>s.status==="rejected").length;
    document.getElementById("footer").innerHTML =
      `Data-driven shell · manifest <code>${esc(CURRENT_MANIFEST)}</code> · one file per site, fetched independently · no values baked into this page.${failed?` · ${failed} site file(s) failed to load.`:""}`;
  })
  .catch(e=>{
    document.getElementById("error").innerHTML =
      `<div class="err">Could not load the manifest (${esc(e.message)}). Serve over HTTP — <code>fetch</code> is blocked on <code>file://</code>.</div>`;
  });
}

// ── Week roll-back bootstrap: load the index, build the dropdown, load a week. ──
fetch(WEEKS_INDEX_URL,{cache:"no-store"})
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(idx=>{
    const weeks = (idx.weeks||[]).slice();   // newest first
    const sel = document.getElementById("weekSel");
    if(!weeks.length) throw new Error("weeks_index.json has no weeks");
    sel.innerHTML = weeks.map(w=>`<option value="${esc(w.file)}">${esc(w.label)}</option>`).join("");
    let saved=null; try{ saved=localStorage.getItem(LS_KEY); }catch(e){}
    const initial = weeks.find(w=>w.file===saved) ? saved : weeks[0].file;
    sel.value = initial;
    sel.addEventListener("change", ()=>{
      try{ localStorage.setItem(LS_KEY, sel.value); }catch(e){}
      document.getElementById("sites").innerHTML = "";
      window.scrollTo(0,0);
      loadWeek(sel.value);
    });
    loadWeek(initial);
  })
  .catch(e=>{
    document.getElementById("error").innerHTML =
      `<div class="err">Could not load the week index (${esc(e.message)}). Serve over HTTP — <code>fetch</code> is blocked on <code>file://</code>.</div>`;
  });
</script>
</body>
</html>
