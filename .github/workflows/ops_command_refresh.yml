name: Ops Command daily bake (Pipe 9)

# Bakes data/ops_command/snapshot_<date>.json from the Neon warehouse and
# commits it. Runs after the warehouse's 08:15 UTC daily export (allow ~45min).
# The dashboard (command/index.html + the desktop artifact) just fetches the
# committed JSON from Pages - a data refresh is a commit, not a redeploy.
#
# Needs WAREHOUSE_DSN only (same value as in MakiManc/maki-hospitality-etl).
#
# 26/08/2026 - THE CROSS-REPO CHECKOUT IS GONE. This workflow used to check
# out MakiManc/maki-hospitality-etl with a fine-grained read-only PAT held
# in a repo secret,
# to read data/kobas_pending_orders/latest.json, because the headless-login
# Kobas feed committed a JSON file into that private repo instead of writing
# to Postgres. That feed is retired: projected spend now comes from the
# 'Kobas Orders' feed, which lands in the warehouse like every other
# feed, so there is nothing to check out and no token to manage. If you are
# re-adding a cross-repo step, read the job-level `env` note below first.
#
# That PAT secret is now unused and can be deleted from Settings > Secrets
# and variables > Actions; no workflow reads it any more.
#
# 27/08/2026 - THE SCHEDULE IS RETIRED (phase 5 of the Neon exit). The daily
# bake now runs in MakiManc/maki-hospitality-etl (.github/workflows/
# ops_command_bake.yml), chained to that repo's export, reading the committed
# pull archive through DuckDB and pushing the snapshot back here. The warehouse
# holds employee names, so it can only live in the private repo; Neon used to be
# the one place both repos could meet, and taking it away means the bake has to
# run where the data is.
#
# THIS FILE IS THE ROLLBACK, WHICH IS WHY IT IS STILL HERE. It still bakes from
# Neon and it still works: "Run workflow" restores the old path in one click for
# as long as Neon holds current data. Put the `schedule:` block back and this
# becomes the daily bake again - but do NOT leave both scheduled, because they
# write the same snapshot file and would overwrite each other daily.
#
# It reads Postgres, so it is only as good as Neon is fresh. Once the export
# stops writing Neon, this stops being a rollback and should be deleted.

on:
  workflow_dispatch:

concurrency:
  group: ops-command-bake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # KEPT AS A WARNING FOR WHOEVER EDITS THIS NEXT (24-25/08/2026, commit
    # 826cbc2): the `secrets` context is NOT available in a step-level `if:`.
    # GitHub rejects the WHOLE FILE with "Unrecognized named-value: 'secrets'"
    # and every run, scheduled or dispatched, dies before a single step
    # executes - the bake stopped running entirely and the dashboard silently
    # froze on the 24 Aug snapshot. `env` IS available in a step `if:`, so any
    # optional step must lift its secret to job-level `env` and test that.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install driver
        run: pip install psycopg2-binary
      - name: Bake snapshot from the warehouse
        env:
          WAREHOUSE_DSN: ${{ secrets.WAREHOUSE_DSN }}
        run: python builders/bake_ops_command.py
      - name: Commit if changed
        run: |
          git config user.name  "ops-command-bake"
          git config user.email "ops@makiramen.com"
          git add data/ops_command/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "ops-command: daily bake $(date -u +%F) (Pipe 9)"
          git push
