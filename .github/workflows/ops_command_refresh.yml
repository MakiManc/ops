name: Ops Command daily bake (Pipe 9)

# Bakes data/ops_command/snapshot_<date>.json from the Neon warehouse and
# commits it. Runs after the warehouse's 08:15 UTC daily export (allow ~45min).
# The dashboard (command/index.html + the desktop artifact) just fetches the
# committed JSON from Pages - a data refresh is a commit, not a redeploy.
#
# Needs WAREHOUSE_DSN (same value as in maki-hospitality-etl), and
# ETL_REPO_TOKEN - a fine-grained PAT with read-only Contents access to
# ross440/maki-hospitality-etl ONLY, used to check out that private repo's
# data/kobas_pending_orders/latest.json (the live Kobas pending-orders feed
# lands there instead of Postgres - see kobas_cloud.py in that repo for
# why). If ETL_REPO_TOKEN is unset or the checkout step fails, the bake
# falls back to the weekly Kobas report unchanged, with a gap note - this
# step is allowed to fail without failing the run.

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC every day (Mon-Sun)
  workflow_dispatch:

concurrency:
  group: ops-command-bake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install driver
        run: pip install psycopg2-binary
      # Read-only pull of the live Kobas pending-orders feed from the
      # private ETL repo. Allowed to fail (missing/expired token, repo
      # renamed, etc.) - bake_ops_command.py falls back to the weekly
      # report + a gap note when etl-data/data/kobas_pending_orders/
      # latest.json isn't present.
      - name: Checkout Kobas pending-orders data (private etl repo)
        if: ${{ secrets.ETL_REPO_TOKEN != '' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ross440/maki-hospitality-etl
          token: ${{ secrets.ETL_REPO_TOKEN }}
          path: etl-data
          sparse-checkout: |
            data/kobas_pending_orders
          sparse-checkout-cone-mode: true
      - name: Bake snapshot from the warehouse
        env:
          WAREHOUSE_DSN: ${{ secrets.WAREHOUSE_DSN }}
          KOBAS_PENDING_ORDERS_PATH: etl-data/data/kobas_pending_orders/latest.json
        run: python builders/bake_ops_command.py
      - name: Commit if changed
        run: |
          git config user.name  "ops-command-bake"
          git config user.email "ops@makiramen.com"
          git add data/ops_command/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "ops-command: daily bake $(date -u +%F) (Pipe 9)"
          git push
