name: Ops data verification

# The daily verification spine (approved self-testing plan, Phases 1+2).
# Two scheduled passes:
#   09:30 UTC morning run - after the whole chain has had its say
#     (03:00 deep pull -> 08:15 daily export -> 09:00 Pipe 9 bake).
#     Timing-class failures (snapshot lag, a slow export, a consistency
#     mismatch) are DEFERRED, not alerted.
#   12:00 UTC recheck - the false-alarm damper: anything still failing
#     now alerts for real. Mode is chosen inside the script by UTC hour.
#
# builders/verify_ops_data.py measures at the DESTINATION (Neon Postgres,
# the live snapshot) and never trusts a workflow's exit code. It also
# upserts the ops_daily_aggregates history archive and sends the Monday
# alive-push (silence is only healthy while the checker is provably alive).
#
# CRITICAL failures: one ntfy push (from the script) + this workflow goes
# red, which fires GitHub's failure email. WARNINGS: recorded in
# data/ops_command/health_latest.json and mirrored to an auto-updated
# GitHub issue - the push channel stays pure.

on:
  schedule:
    - cron: "30 9 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: ops-verify
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install driver
        run: pip install psycopg2-binary
      - name: Verify the ops data system
        env:
          WAREHOUSE_DSN: ${{ secrets.WAREHOUSE_DSN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python builders/verify_ops_data.py
      - name: Commit health + history (green or red)
        if: always()
        run: |
          # The 4b recompute writes scratch snapshots into a temp dir, but
          # belt-and-braces: discard ANY unstaged repo change that is not
          # the two files this workflow owns, so the rebase below is clean.
          git config user.name  "ops-verify"
          git config user.email "ops@makiramen.com"
          git add data/ops_command/health_latest.json data/ops_command/verify_history.json
          git checkout -- . 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "health unchanged"
          else
            git commit -m "ops-verify: health $(date -u '+%F %H:%M')"
            git pull --rebase origin main
            git push
          fi
      # Warnings live on the Data Health page AND an auto-updated issue -
      # no push, no email (plan §3).
      - name: Mirror warnings to a GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json
          h = json.load(open("data/ops_command/health_latest.json"))
          warn = h.get("warnings", []) + h.get("deferred", [])
          lines = [f"_Auto-updated by verify.yml - {h['generated_at']} "
                   f"({h.get('mode','?')} run, overall **{h['overall']}**)_",
                   ""]
          for w in warn:
              lines.append(f"- **[{w['check']}]** "
                           f"{w.get('feed','')} - {w['detail']}")
          if not warn:
              lines.append("No warnings - this issue closes automatically.")
          open("/tmp/warn_body.md", "w").write("\n".join(lines) + "\n")
          print(f"{len(warn)} warning(s) for the issue mirror")
          EOF
          # The mirror is a convenience surface - its own failure must never
          # fail the verify run (warnings always remain in health_latest.json
          # and on the Data Health tab). Notably: GitHub disables Issues on
          # forks by default; until Issues is enabled on this repo, this
          # step just logs and moves on.
          WARN_N=$(python3 -c "import json;h=json.load(open('data/ops_command/health_latest.json'));print(len(h.get('warnings',[])+h.get('deferred',[])))")
          if ! gh label create data-health --description "Ops data verifier warnings" --color D93F0B --force 2>/tmp/gh_err; then
            echo "issue mirror unavailable ($(cat /tmp/gh_err | head -1)) - warnings stay in health_latest.json / Data Health tab"
            exit 0
          fi
          NUM=$(gh issue list --label data-health --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ "$WARN_N" -gt 0 ]; then
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body-file /tmp/warn_body.md \
                && echo "updated issue #$NUM" || echo "issue edit failed - non-fatal"
            else
              gh issue create --title "Ops data health — warnings" \
                --label data-health --body-file /tmp/warn_body.md \
                || echo "issue create failed - non-fatal"
            fi
          else
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" --comment "All warnings cleared ($(date -u '+%F %H:%M UTC'))." \
                && echo "closed issue #$NUM" || echo "issue close failed - non-fatal"
            else
              echo "no warnings, no open issue - nothing to do"
            fi
          fi
      # Backstop push: fires only if the job failed AND the script did not
      # already send its own (crash before the push, driver install failed,
      # commit step failed...). The verifier must never die silently.
      - name: Backstop alert (ntfy push)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -f .ntfy_sent ]; then
            echo "script already pushed - no duplicate"
            exit 0
          fi
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC not set - skipping push"
            exit 0
          fi
          curl -fsS -m 15 --retry 3 \
            -H "Title: Ops data verifier CRASHED" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "verify.yml went red without completing its checks on $(date -u '+%F %H:%M UTC'). The safety net itself needs looking at. https://github.com/ross440/ops/actions" \
            "https://ntfy.sh/$NTFY_TOPIC" || echo "ntfy push itself failed - GitHub failure email is the backstop"
